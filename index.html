<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />

    <title>Bảo Phong — Thiết kế website cho nhà hàng, homestay và tiệm dịch vụ</title>
    <meta
      name="description"
      content="Nhận thiết kế website cho nhà hàng, homestay, tiệm nail và spa. Khách tìm thấy quán trên Google, xem thực đơn trên điện thoại, gọi hoặc nhắn Zalo ngay từ website. 5 sản phẩm đã bàn giao tại Việt Nam và Hoa Kỳ."
    />
    <link rel="canonical" href="https://phongbao-uopeopleuni.github.io/bao-phong-web/" />

    <!--
      og:image PHAI la URL tuyet doi tro tới file PNG. Crawler cua Facebook, Zalo va
      LinkedIn khong doc duoc data URI, khong doc SVG, va khong tu ghep duong dan tuong doi.
      TODO: neu doi sang ten mien rieng thi sua ca 4 URL tuyet doi ben duoi
      (canonical, og:url, og:image, twitter:image) va `base` trong vite.config.ts.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://phongbao-uopeopleuni.github.io/bao-phong-web/" />
    <meta
      property="og:title"
      content="Bảo Phong — Thiết kế website cho nhà hàng, homestay và tiệm dịch vụ"
    />
    <meta
      property="og:description"
      content="Website mang khách tới: tìm thấy trên Google, xem tốt trên điện thoại, một cái bấm là gọi hoặc nhắn Zalo. 5 sản phẩm thật đang chạy."
    />
    <meta
      property="og:image"
      content="https://phongbao-uopeopleuni.github.io/bao-phong-web/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bảo Phong — thiết kế website cho nhà hàng, homestay và tiệm dịch vụ"
    />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:site_name" content="Bảo Phong" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Bảo Phong — Thiết kế website cho nhà hàng, homestay và tiệm dịch vụ"
    />
    <meta
      name="twitter:description"
      content="Website mang khách tới: tìm thấy trên Google, xem tốt trên điện thoại, một cái bấm là gọi hoặc nhắn Zalo. 5 sản phẩm thật đang chạy."
    />
    <meta
      name="twitter:image"
      content="https://phongbao-uopeopleuni.github.io/bao-phong-web/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="Bảo Phong — thiết kế website cho nhà hàng, homestay và tiệm dịch vụ"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
