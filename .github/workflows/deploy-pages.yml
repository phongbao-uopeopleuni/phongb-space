name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  # Cho phep chay tay tu tab Actions
  workflow_dispatch:

# Mac dinh khong cap quyen; tung job chi mo dung phan no can.
permissions: {}

# Neu push lien tiep, huy lan build cu de khong deploy chong cheo
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Cac action duoc GHIM VAO COMMIT SHA thay vi thẻ dang @v4.
#
# Ly do: thẻ trong Git la con tro DI DONG. Neu tai khoan cua mot action bi chiem,
# ke tan cong tro thẻ @v4 sang commit doc va moi lan build cua minh se chay code do —
# tuc chen duoc bat ky thu gi vao website. Ghim SHA thi noi dung khong the doi.
#
# Doi lai: phai tu cap nhat SHA khi muon nang phien ban. Lay SHA moi bang:
#   gh api repos/actions/checkout/git/ref/tags/v4 --jq .object.sha
# Comment sau moi dong ghi ro SHA nay tuong ung thẻ nao.
# ---------------------------------------------------------------------------

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` cai dung phien ban trong package-lock.json, khong tu nang len ban moi
      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install browser for quality checks
        run: npx playwright install --with-deps chromium

      # GITHUB_PAGES='true' bat `base: '/<ten-repo>/'` trong vite.config.ts.
      # Thieu bien nay thi asset se tro ve goc domain va vo het.
      - name: Build
        run: npm run build:pages

      - name: Browser smoke test and Lighthouse budgets
        run: npm run verify:preview

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
