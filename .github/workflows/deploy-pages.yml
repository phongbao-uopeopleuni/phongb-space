name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Cho phep chay tay tu tab Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Neu push lien tiep, huy lan build cu de khong deploy chong cheo
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # GITHUB_PAGES='true' bat `base: '/<ten-repo>/'` trong vite.config.ts.
      # Thieu bien nay thi asset se tro ve goc domain va vo het.
      - name: Build
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
